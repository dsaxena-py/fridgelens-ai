# The 25 MealLens detector classes. This file is the contract with the backend:
# `index` is the YOLO class id, and `slug` must equal ingredients.slug in the database
# (fridgelens-backend/seed_data/ingredients.yaml, field `class`). Never reorder; only append.
#
# aliases: names other datasets use for the class (case-insensitive; "_" and "-" read as spaces).
# openimages: matching Open Images V7 boxable class names, if any.

- {index: 0, slug: apple, name: Apple, openimages: [Apple], aliases: [apples, red apple, green apple]}
- {index: 1, slug: banana, name: Banana, openimages: [Banana], aliases: [bananas]}
- {index: 2, slug: orange, name: Orange, openimages: [Orange], aliases: [oranges, mandarin, navel orange]}
